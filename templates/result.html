<!DOCTYPE html>
<html>
<head>
    <title>AI Diagnosis Result</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            perspective: 1000px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            width: 100%;
            aspect-ratio: 3/4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }

        .container:hover .card {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            color: white;
            padding: 20px;
            text-align: center;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back {
            transform: rotateY(180deg);
        }

        img {
            width: 140px;
            margin: 10px auto;
            border-radius: 12px;
            transition: 0.4s;
        }

        img:hover {
            transform: scale(1.05);
        }

        h2 {
            margin: 8px 0;
            font-size: 20px;
        }

        .malignant {
            color: #ff4d4d;
        }

        .benign {
            color: #2ecc71;
        }

        .confidence {
            font-size: 14px;
            margin: 5px 0;
        }

        .description, .advice {
            font-size: 13px;
            margin-top: 10px;
            line-height: 1.4;
        }

        .btn {
            margin-top: 15px;
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .hint {
            margin-top: 8px;
            font-size: 11px;
            color: #ccc;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- FRONT -->
        <div class="face">

            <h2>AI Diagnosis</h2>

            <img src="{{ image_path }}" alt="Image">

            {% if result == "Malignant" %}
                <h2 class="malignant">⚠ {{ result }}</h2>
            {% else %}
                <h2 class="benign">✔ {{ result }}</h2>
            {% endif %}

            <div class="confidence">
                Confidence: {{ confidence }}%
            </div>

            <div class="hint">
                Hover to view medical report →
            </div>

        </div>

        <!-- BACK -->
        <div class="face back">

            <h2>Medical Report</h2>

            <div class="description">
                <strong>AI Interpretation:</strong><br>
                {{ description }}
            </div>

            <div class="advice">
                <strong>Recommendation:</strong><br>
                {{ advice }}
            </div>

            <a href="/">
                <button class="btn">Analyze Again</button>
            </a>

        </div>

    </div>
</div>

</body>
</html>
