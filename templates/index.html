<!DOCTYPE html>
<html>
<head>
    <title>AI Skin Cancer Detection</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .card{
            width:900px;
            height:450px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border-radius:25px;
            box-shadow:0 25px 60px rgba(0,0,0,0.4);
            display:flex;
            padding:50px;
            color:white;
            gap:50px;
        }

        .left{
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .button-group{
            display:flex;
            flex-direction:column;
            gap:25px;   /* Proper spacing between buttons */
        }

        .right{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        h1{
            font-size:28px;
            margin-bottom:10px;
        }

        p{
            font-size:15px;
            color:#ddd;
            margin-bottom:40px;
        }

        input[type="file"]{
            display:none;
        }

        .upload-btn{
            padding:14px 40px;
            border-radius:40px;
            background:linear-gradient(135deg,#00c6ff,#0072ff);
            cursor:pointer;
            transition:0.3s;
            width:260px;
            text-align:center;
        }

        .upload-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(0,0,0,0.4);
        }

        .analyze-btn{
            padding:14px 40px;
            border-radius:40px;
            border:none;
            background:linear-gradient(135deg,#11998e,#38ef7d);
            cursor:pointer;
            transition:0.3s;
            width:260px;
        }

        .analyze-btn:hover{
            transform:scale(1.05);
        }

        .preview-box{
            width:170px;
            height:170px;
            border-radius:25px;
            background:rgba(255,255,255,0.1);
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .preview-box img{
            max-width:100%;
            max-height:100%;
            border-radius:20px;
            display:none;
        }

    </style>
</head>
<body>

<div class="card">

    <!-- LEFT SIDE -->
    <div class="left">
        <h1>AI Skin Cancer Detection</h1>
        <p>Deep Learning Based Medical Image Analysis</p>

        <form method="POST" enctype="multipart/form-data">

            <div class="button-group">
                <input type="file" id="file-upload" name="image" required>

                <label for="file-upload" class="upload-btn">
                    Upload Image
                </label>

                <button type="submit" class="analyze-btn">
                    Analyze Image
                </button>
            </div>

        </form>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="preview-box">
            <img id="preview">
        </div>
    </div>

</div>

<script>
    const fileInput = document.getElementById("file-upload");
    const preview = document.getElementById("preview");

    fileInput.addEventListener("change", function() {
        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = "block";
            }
            reader.readAsDataURL(fileInput.files[0]);
        }
    });
</script>

</body>
</html>
